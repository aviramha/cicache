name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}

  # Proves the cache round trip end to end against the real Actions cache service: the first job
  # populates it, the second starts from an empty local state and must hit.
  cache-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Expose the Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (name.endsWith('TOKEN')) core.setSecret(process.env[name])
              core.exportVariable(name, process.env[name])
            }
      - name: Start proxy
        run: ./target/release/cicache start --key-prefix "e2e-${{ github.run_id }}"
      - name: Fetch an artifact twice
        run: |
          set -euo pipefail
          url=https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz
          first=$(curl -sS -o /tmp/a.tgz -w '%header{x-cicache}' "$url")
          second=$(curl -sS -o /tmp/b.tgz -w '%header{x-cicache}' "$url")
          echo "first=$first second=$second"
          [ "$first" = MISS ] && [ "$second" = HIT ]
          cmp /tmp/a.tgz /tmp/b.tgz
      - name: Stop proxy
        if: always()
        run: ./target/release/cicache stop
      - name: Assert the entry was uploaded
        run: |
          stored=$(jq -r .entries_stored "${RUNNER_TEMP}/cicache/summary.json")
          echo "entries_stored=$stored"
          [ "$stored" -ge 1 ]

  cache-read:
    needs: cache-write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Expose the Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (name.endsWith('TOKEN')) core.setSecret(process.env[name])
              core.exportVariable(name, process.env[name])
            }
      - name: Start proxy with no local state
        run: ./target/release/cicache start --key-prefix "e2e-${{ github.run_id }}"
      - name: The first fetch in a fresh job must come from the cache service
        run: |
          set -euo pipefail
          url=https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz
          result=$(curl -sS -o /tmp/a.tgz -w '%header{x-cicache}' "$url")
          echo "result=$result"
          [ "$result" = HIT ]
      - name: Stop proxy
        if: always()
        run: ./target/release/cicache stop
